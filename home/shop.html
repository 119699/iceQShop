<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rucishop - Shop</title><style>body{margin:0;padding:0;background:linear-gradient(135deg,#0c0c0c 0%,#1a0033 100%);color:#ffffff;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans JP','Hiragino Sans',sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;overflow:auto}.container{text-align:center;z-index:10;position:relative;padding:20px}h1{font-size:4rem;margin:0;text-shadow:0 0 5px #8a2be2,0 0 10px #8a2be2,0 0 15px #00ffff,0 0 20px #00ffff,0 0 35px #8a2be2,0 0 40px #8a2be2;animation:glow 2s ease-in-out infinite alternate}@keyframes glow{from{text-shadow:0 0 5px #8a2be2,0 0 10px #8a2be2,0 0 15px #00ffff,0 0 20px #00ffff,0 0 35px #8a2be2,0 0 40px #8a2be2}to{text-shadow:0 0 10px #8a2be2,0 0 20px #8a2be2,0 0 30px #00ffff,0 0 40px #00ffff,0 0 50px #8a2be2,0 0 60px #8a2be2}}.breadcrumb{margin-top:10px;font-size:1rem;opacity:0.8;text-shadow:0 0 10px #8a2be2}.breadcrumb a{color:#ffffff;text-decoration:none;transition:all 0.3s ease}.breadcrumb a:hover{text-shadow:0 0 10px #8a2be2,0 0 20px #00ffff;transform:scale(1.05);display:inline-block}.breadcrumb span{margin:0 5px}.images{margin-top:30px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}.image-container{display:flex;flex-direction:column;align-items:center;text-align:center}.gif-image{width:100%;max-width:300px;height:auto;aspect-ratio:950/550;border:2px solid #8a2be2;border-radius:8px;box-shadow:0 0 5px #8a2be2;transition:all 0.3s ease}.gif-image:hover{box-shadow:0 0 10px #8a2be2,0 0 30px #8a2be2;transform:scale(1.05)}.image-description{font-size:0.9rem;margin-top:10px;opacity:0.8;text-shadow:0 0 10px #8a2be2;max-width:300px}#dust-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}@media (max-width:768px){body{overflow:hidden;margin-top:-30px}h1{font-size:2.5rem}.gif-image{max-width:200px}.image-description{font-size:0.8rem;max-width:200px}.breadcrumb{font-size:0.8rem}}</style></head><body><canvas id="dust-canvas"></canvas><div class="container"><h1>Rucishop</h1><div class="breadcrumb"><a href="https://119699.github.io/iceQShop/home.html">ホーム</a><span>></span><span>ショップ</span></div><div class="images"><div class="image-container"><a href="https://119699.github.io/iceQShop/home/shop/psn.html"><img src="https://raw.githubusercontent.com/119699/iceQShop/main/Image/Shop/playstation.gif" alt="PlayStation Item" class="gif-image"></a><p class="image-description">PlayStation</p></div><div class="image-container"><a href="https://119699.github.io/iceQShop/home/shop/gtav.html"><img src="https://raw.githubusercontent.com/119699/iceQShop/main/Image/Shop/gtav.gif" alt="GTA V Item" class="gif-image"></a><p class="image-description">Grand Theft Auto V</p></div><div class="image-container"><a href="https://119699.github.io/iceQShop/home/shop/socialclub.html"><img src="https://raw.githubusercontent.com/119699/iceQShop/main/Image/Shop/rockstarx.gif" alt="Rockstar Item" class="gif-image"></a><p class="image-description">Rockstar Games</p></div></div></div><script>const canvas=document.getElementById('dust-canvas');const ctx=canvas.getContext('2d');canvas.width=window.innerWidth;canvas.height=window.innerHeight;const particles=[];const numParticles=100;class Particle{constructor(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.size=Math.random()*2+1;this.speedX=Math.random()*0.5-0.25;this.speedY=Math.random()*0.5-0.25;this.opacity=Math.random()*0.5+0.1}update(){this.x+=this.speedX;this.y+=this.speedY;if(this.x>canvas.width||this.x<0)this.x=Math.random()*canvas.width;if(this.y>canvas.height||this.y<0)this.y=Math.random()*canvas.height;this.opacity=Math.random()*0.5+0.1}draw(){ctx.save();ctx.globalAlpha=this.opacity;ctx.fillStyle='#ff00ff';ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore()}}for(let i=0;i<numParticles;i++)particles.push(new Particle());function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(animate)}animate();window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight})</script></body></html>
